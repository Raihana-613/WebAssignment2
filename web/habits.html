
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FocusFlow | Habit Tracker</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #101522;
    color: #f1f5f9;
}

header, nav { background: #181f30; padding: 20px 7%; }

header h1 { margin: 0; color: #a5b4fc; }
header p { color: #a5afc3; margin-bottom: 0; }

nav { display: flex; flex-wrap: wrap; gap: 12px; padding-top: 0; }

nav a {
    color: #cbd5e1;
    text-decoration: none;
    padding: 10px 15px;
    border-radius: 8px;
}

nav a:hover, nav a.active { background: #303b55; color: white; }

main { max-width: 1200px; margin: 30px auto; padding: 0 18px; }

.card {
    background: #1b2334;
    border: 1px solid #30394d;
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 22px;
}

input, select {
    background: #101522;
    color: white;
    border: 1px solid #46516a;
    padding: 11px;
    border-radius: 7px;
}

button {
    background: #818cf8;
    color: #101522;
    border: 0;
    border-radius: 7px;
    padding: 11px 15px;
    cursor: pointer;
    font-weight: bold;
}

button:disabled { opacity: 0.5; cursor: wait; }

.muted { color: #a5afc3; }

.table-wrap {
    overflow: auto;
    max-height: 65vh;
    border: 1px solid #30394d;
    border-radius: 8px;
}

table {
    border-collapse: separate;
    border-spacing: 0;
    width: 100%;
    min-width: 650px;
}

th, td {
    padding: 8px;
    text-align: center;
    border-right: 1px solid #30394d;
    border-bottom: 1px solid #30394d;
}

th { background: #252e42; }

th:first-child, td:first-child {
    position: sticky;
    left: 0;
    z-index: 2;
    background: #20293b;
    min-width: 110px;
}

thead th { position: sticky; top: 0; z-index: 3; }

thead th:first-child { z-index: 4; }

.habit-heading {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    height: 115px;
    min-width: 42px;
    max-width: 55px;
    overflow: hidden;
}

.cell-button {
    width: 34px;
    height: 34px;
    padding: 0;
    font-size: 17px;
    background: #30394d;
    color: #cbd5e1;
}

.cell-button.done { background: #166534; color: #dcfce7; }
.cell-button.missed { background: #7f1d1d; color: #fee2e2; }

.today { outline: 2px solid #818cf8; outline-offset: -2px; }

footer { text-align: center; padding: 25px; color: #8590a6; }
</style>
</head>

<body>
<header>
    <h1>FocusFlow</h1>
    <p>Your daily habits, one day at a time.</p>
</header>

<nav>
    <a href="index.html">Dashboard</a>
    <a href="analysis.html">Analysis</a>
    <a href="habits.html" class="active">Habits</a>
    <a href="tasks.html">Tasks</a>
</nav>

<main>
    <h2>Monthly Habit Tracker</h2>
    <p class="muted">Click a cell to cycle through blank, ✓ and ✗.</p>

    <section class="card">
        <label for="month">Choose month: </label>
        <input type="month" id="month">
        <button onclick="loadHabits()">Show Month</button>
    </section>

    <section class="card">
        <h3>Add a Habit</h3>
        <form id="habitForm">
            <input id="habitName" maxlength="100"
                   placeholder="e.g. Read for 20 minutes" required>
            <button type="submit">Add Habit</button>
        </form>
        <p class="muted" id="message"></p>
    </section>

    <section class="card">
        <h3 id="gridTitle">Your Habits</h3>
        <div class="table-wrap">
            <table id="habitTable"></table>
        </div>
        <p class="muted">Blank = not marked, ✓ = done, ✗ = missed.</p>
    </section>
</main>

<footer>FocusFlow | Student Productivity &amp; Habit Tracker</footer>

<script>
const monthInput = document.getElementById("month");
const message = document.getElementById("message");
const table = document.getElementById("habitTable");

const today = new Date();
monthInput.value =
    today.getFullYear() + "-" +
    String(today.getMonth() + 1).padStart(2, "0");

let habitsData = [];

function showMessage(text) {
    message.textContent = text;
}

async function loadHabits() {
    showMessage("Loading habits...");

    try {
        const response = await fetch(
            "habits?month=" + encodeURIComponent(monthInput.value)
        );

        if (!response.ok) throw new Error("Could not load habits");

        const data = await response.json();
        habitsData = data.habits;

        const logMap = {};

        data.logs.forEach(function(log) {
            logMap[log.habitId + "_" + log.date] = log.status;
        });

        const year = data.year;
        const month = data.month;
        const days = data.days;

        document.getElementById("gridTitle").textContent =
            "Habits for " + monthInput.value;

        let html = "<thead><tr><th>Date</th>";

        data.habits.forEach(function(habit) {
            html += '<th><div class="habit-heading" title="' +
                escapeHTML(habit.name) + '">' +
                escapeHTML(habit.name) + "</div></th>";
        });

        html += "</tr></thead><tbody>";

        for (let day = 1; day <= days; day++) {
            const date = year + "-" +
                String(month).padStart(2, "0") + "-" +
                String(day).padStart(2, "0");

            const isToday =
                date === today.getFullYear() + "-" +
                String(today.getMonth() + 1).padStart(2, "0") + "-" +
                String(today.getDate()).padStart(2, "0");

            html += "<tr><td" +
                (isToday ? ' class="today"' : "") +
                ">" + day + "</td>";

            data.habits.forEach(function(habit) {
                const status = logMap[habit.id + "_" + date] || "PENDING";
                let symbol = "";
                let css = "";

                if (status === "DONE") {
                    symbol = "✓";
                    css = "done";
                } else if (status === "MISSED") {
                    symbol = "✗";
                    css = "missed";
                }

                html += '<td><button class="cell-button ' + css +
                    '" data-id="' + habit.id +
                    '" data-date="' + date +
                    '" data-status="' + status +
                    '" aria-label="' + escapeHTML(habit.name) +
                    " on " + date + ': ' + status +
                    '">' + symbol + "</button></td>";
            });

            html += "</tr>";
        }

        html += "</tbody>";
        table.innerHTML = html;
        showMessage("Habit tracker loaded.");

    } catch (error) {
        showMessage("Could not load habits. Check the server.");
        console.log(error);
    }
}

function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, function(ch) {
        return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        }[ch];
    });
}

document.getElementById("habitForm").addEventListener(
    "submit", async function(event) {
        event.preventDefault();

        const name = document.getElementById("habitName").value.trim();
        if (!name) return;

        const body = new URLSearchParams();
        body.append("action", "add");
        body.append("habitName", name);

        try {
            const response = await fetch("habits", {
                method: "POST",
                headers: {
                    "Content-Type":
                        "application/x-www-form-urlencoded"
                },
                body: body.toString()
            });

            if (!response.ok) throw new Error("Could not add habit");

            document.getElementById("habitName").value = "";
            await loadHabits();
            showMessage("Habit added successfully.");

        } catch (error) {
            showMessage("Could not add habit. Check the server.");
            console.log(error);
        }
    }
);

table.addEventListener("click", async function(event) {
    const button = event.target.closest("button[data-id]");
    if (!button || button.disabled) return;

    const previousStatus = button.dataset.status;

    const nextStatus = previousStatus === "PENDING"
        ? "DONE"
        : previousStatus === "DONE"
            ? "MISSED"
            : "PENDING";

    button.disabled = true;

    const body = new URLSearchParams();
    body.append("action", "update");
    body.append("habitId", button.dataset.id);
    body.append("date", button.dataset.date);
    body.append("status", nextStatus);

    try {
        const response = await fetch("habits", {
            method: "POST",
            headers: {
                "Content-Type":
                    "application/x-www-form-urlencoded"
            },
            body: body.toString()
        });

        if (!response.ok) throw new Error("Could not save status");

        await loadHabits();
        showMessage("Habit status saved.");

    } catch (error) {
        showMessage("Could not save status. Try again.");
        console.log(error);
    } finally {
        button.disabled = false;
    }
});

loadHabits();
</script>
</body>
</html>
